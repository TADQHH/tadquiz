services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:4321"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/tadquiz.sqlite
      # Set these to override the auto-generated .env (gen-env skips keys
      # already present in the process environment):
      # SITE_URL: https://quiz.example.com
      # SESSION_SECRET: <long-random-string>
    volumes:
      - tadquiz-data:/data
    restart: unless-stopped
    depends_on:
      - grist
    networks:
      - default
      - clueoj_nginx

  grist:
    image: gristlabs/grist:latest
    ports:
      - "${GRIST_PORT:-8484}:8484"
    volumes:
      - grist-data:/persist
      - grist-docs:/docs
    environment:
      # Api key cho TADQuiz nằm trong .env của repo (GRIST_API_KEY),
      # tạo trong Grist UI: Account Settings → API.
      GRIST_HOST: grist
      GRIST_SINGLE_PORT: "true"
      # Bảo vệ lần truy cập đầu (đặt giá trị riêng ở .env khi lên production).
      GRIST_BOOT_KEY: ${GRIST_BOOT_KEY:-}
      # Email này được đăng nhập tự động (dùng để provision user đầu tiên).
      GRIST_DEFAULT_EMAIL: ${GRIST_DEFAULT_EMAIL:-}
      # Canonical URL khi chạy sau reverse proxy (nginx → sheet.tad.io.vn).
      APP_HOME_URL: ${GRIST_PUBLIC_URL:-}
    restart: unless-stopped
    networks:
      - default
      - clueoj_nginx

volumes:
  tadquiz-data:
  grist-data:
  grist-docs:

networks:
  default:
    name: tadquiz_default
  clueoj_nginx:
    external: true
